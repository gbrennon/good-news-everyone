name: Verify npm token
description: Verify an npm registry token
inputs:
  token:
    description: npm registry token
    required: true
runs:
  using: composite
  steps:
    - name: Verify npm authentication
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [[ -z "$TOKEN" ]]; then
          printf 'NPM_TOKEN is not configured in repository secrets\n' >&2
          exit 1
        fi
        curl --fail --silent --show-error \
          --proto '=https' --tlsv1.2 \
          --header "Authorization: Bearer $TOKEN" \
          --header 'Accept: application/json' \
          https://registry.npmjs.org/-/whoami >/dev/null
