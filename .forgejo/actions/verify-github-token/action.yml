name: Verify GitHub token
description: Verify a GitHub API token
inputs:
  token:
    description: GitHub release token
    required: true
runs:
  using: composite
  steps:
    - name: Verify GitHub authentication
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [[ -z "$TOKEN" ]]; then
          printf 'GH_RELEASE_TOKEN is not configured in repository secrets\n' >&2
          exit 1
        fi
        curl --fail --silent --show-error \
          --proto '=https' --tlsv1.2 \
          --header "Authorization: Bearer $TOKEN" \
          --header 'Accept: application/vnd.github+json' \
          https://api.github.com/user >/dev/null
