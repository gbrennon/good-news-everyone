name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref_name:
        description: Release tag to publish
        required: true
        type: string
      source_ref:
        description: Git revision containing the release workflow and package
        required: false
        type: string

jobs:
  publish:
    name: Publish npm package
    runs-on: codeberg-medium
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || inputs.ref_name || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Validate release
        id: validate
        uses: ./.forgejo/actions/validate-npm-release
        with:
          ref-name: ${{ inputs.ref_name || github.ref_name }}

      - name: Package npm release
        id: package
        uses: ./.forgejo/actions/package-npm-release

      - name: Publish npm package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          ASSET: ${{ steps.package.outputs.asset }}
          PRERELEASE: ${{ steps.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ -z "$NPM_TOKEN" ]]; then
            printf 'NPM_TOKEN is not configured in repository secrets\n' >&2
            exit 1
          fi
          npmrc="$RUNNER_TEMP/npmrc"
          trap 'rm -f "$npmrc"' EXIT
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' \
            "$NPM_TOKEN" > "$npmrc"
          chmod 600 "$npmrc"
          dist_tag=latest
          [[ "$PRERELEASE" == true ]] && dist_tag=next
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish "$ASSET" --access public --tag "$dist_tag"
