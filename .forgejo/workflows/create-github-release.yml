name: Create GitHub release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref_name:
        description: Release tag to publish
        required: true
        type: string
      source_ref:
        description: Git revision containing the release workflow and package
        required: false
        type: string

jobs:
  release:
    name: Create GitHub release
    runs-on: codeberg-medium
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || inputs.ref_name || github.ref }}

      - name: Validate release
        id: validate
        uses: ./.forgejo/actions/validate-npm-release
        with:
          ref-name: ${{ inputs.ref_name || github.ref_name }}

      - name: Package npm release
        id: package
        uses: ./.forgejo/actions/package-npm-release

      - name: Generate release notes
        id: notes
        uses: ./.forgejo/actions/generate-release-notes
        with:
          ref-name: ${{ inputs.ref_name || github.ref_name }}

      - name: Create GitHub release
        id: release
        uses: ./.forgejo/actions/create-forge-release
        with:
          api-url: https://api.github.com
          repository: gbrennon/good-news-everyone
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          auth-scheme: bearer
          tag: ${{ inputs.ref_name || github.ref_name }}
          notes: ${{ steps.notes.outputs.path }}
          target-commitish: ${{ inputs.ref_name || github.sha }}
          prerelease: ${{ steps.validate.outputs.prerelease }}

      - name: Upload npm tarball
        uses: ./.forgejo/actions/upload-forge-release-asset
        with:
          upload-url: ${{ steps.release.outputs.upload-url }}
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          auth-scheme: bearer
          asset: ${{ steps.package.outputs.asset }}
