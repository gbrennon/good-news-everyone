name: Release pull request validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release credentials
    if: >-
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: codeberg-small
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate release branch and package version
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release branch: %s\n' "$HEAD_REF" >&2
            exit 1
          fi
          git fetch --no-tags origin "$HEAD_SHA"
          expected_version="${HEAD_REF#release/v}"
          package_version="$(git show "$HEAD_SHA:package.json" | jq -r '.version')"
          if [[ "$package_version" != "$expected_version" ]]; then
            printf 'package.json version %s does not match release %s\n' \
              "$package_version" "$expected_version" >&2
            exit 1
          fi

      - name: Verify npm authentication
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            printf 'NPM_TOKEN is not configured in repository secrets\n' >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $TOKEN" \
            --header 'Accept: application/json' \
            https://registry.npmjs.org/-/whoami >/dev/null

      - name: Verify GitHub authentication
        env:
          TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            printf 'GH_RELEASE_TOKEN is not configured in repository secrets\n' >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/user >/dev/null

      - name: Verify Codeberg authentication
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --header "Authorization: token $TOKEN" \
            --header 'Accept: application/json' \
            "$API_URL/repos/$REPOSITORY" >/dev/null
